<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地任务看板</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>任务看板</h1>
        <span class="sub">AGENT AUTOLOOP · 本机</span>
      </div>
      <p id="summary" class="summary-line" aria-label="汇总">正在读取…</p>
      <div class="toolbar">
        <span id="notice" class="notice" role="status" aria-live="polite"></span>
        <span id="status" role="status" aria-live="polite">正在读取…</span
        ><button id="refresh" type="button">立即刷新</button>
      </div>
    </header>
    <main id="layout" class="layout">
      <section class="pane list-pane" aria-label="待我处理">
        <div id="waiting" class="panel">
          <h2 class="panel-head"><span class="tag">待我处理</span></h2>
          <p>正在读取…</p>
        </div>
        <details id="scheduled" class="panel scheduled">
          <summary>定时任务</summary>
        </details>
      </section>
      <section class="pane detail-pane" aria-label="卡片详情">
        <p id="detail-empty" class="empty">在左边选一张卡片查看内容</p>
        <section id="detail" class="panel" hidden></section>
      </section>
    </main>
    <footer class="legend">
      <span><i class="dot ask"></i> 等你决定</span><span><i class="dot notice"></i> 通知</span
      ><span><i class="dot run"></i> 在跑</span>
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
